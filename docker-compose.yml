services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kazi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kazi_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-kazi}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-kazi}:${POSTGRES_PASSWORD:-kazi_local_only}@db:5432/${POSTGRES_DB:-kazi}?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 15s
volumes:
  postgres_data:
